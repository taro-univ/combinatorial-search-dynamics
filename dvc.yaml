stages:
  generate_instances:
    cmd: uv run csd generate-instances --force
    deps:
      - configs/config.yaml
      - configs/experiment/knapsack_pilot.yaml
      - configs/task/knapsack.yaml
      - configs/storage/knapsack_local.yaml
      - src/combinatorial_search_dynamics/tasks/knapsack.py
      - src/combinatorial_search_dynamics/tasks/registry.py
      - src/combinatorial_search_dynamics/identifiers.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/raw/knapsack_pilot/instances.parquet
  solve_references:
    cmd: uv run csd solve-references --force
    deps:
      - data/raw/knapsack_pilot/instances.parquet
      - configs/task/knapsack.yaml
      - configs/solver/ortools_cp_sat.yaml
      - configs/storage/knapsack_local.yaml
      - src/combinatorial_search_dynamics/solvers/base.py
      - src/combinatorial_search_dynamics/solvers/registry.py
      - src/combinatorial_search_dynamics/solvers/ortools_knapsack.py
      - src/combinatorial_search_dynamics/data/schemas.py
      - src/combinatorial_search_dynamics/data/references.py
      - src/combinatorial_search_dynamics/data/reference_validation.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/raw/knapsack_pilot/reference_solutions.parquet
  collect_trajectories:
    cmd: uv run csd collect --force
    deps:
      - data/raw/knapsack_pilot/instances.parquet
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - configs/config.yaml
      - configs/search/default.yaml
      - configs/search_method/randomized_first_improvement.yaml
      - configs/search_method/simulated_annealing.yaml
      - configs/search_method/tabu.yaml
      - configs/search_method/classical_comparison.yaml
      - configs/observation/external_only.yaml
      - configs/experiment/knapsack_pilot.yaml
      - configs/task/knapsack.yaml
      - configs/storage/knapsack_local.yaml
      - src/combinatorial_search_dynamics/search/base.py
      - src/combinatorial_search_dynamics/search/algorithms.py
      - src/combinatorial_search_dynamics/search/initialization.py
      - src/combinatorial_search_dynamics/search/registry.py
      - src/combinatorial_search_dynamics/data/parquet.py
      - src/combinatorial_search_dynamics/data/schemas.py
      - src/combinatorial_search_dynamics/data/zarr.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/raw/knapsack_pilot/trials.parquet
      - data/raw/knapsack_pilot/checkpoints.parquet
      - data/raw/knapsack_pilot/observations.zarr
      - data/raw/knapsack_pilot/metrics.parquet
  prepare_trajectories:
    cmd: uv run csd prepare --force
    deps:
      - data/raw/knapsack_pilot/instances.parquet
      - data/raw/knapsack_pilot/trials.parquet
      - data/raw/knapsack_pilot/checkpoints.parquet
      - data/raw/knapsack_pilot/observations.zarr
      - data/raw/knapsack_pilot/metrics.parquet
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - src/combinatorial_search_dynamics/data/validation.py
      - src/combinatorial_search_dynamics/data/reference_validation.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/interim/knapsack_pilot/trajectories.json
  extract_features:
    cmd: uv run csd extract --force
    deps:
      - data/interim/knapsack_pilot/trajectories.json
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - configs/observation/external_only.yaml
      - src/combinatorial_search_dynamics/features/external.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/derived/knapsack_pilot/features.json
  make_splits:
    cmd: uv run csd split --force
    deps:
      - data/derived/knapsack_pilot/features.json
      - data/raw/knapsack_pilot/instances.parquet
      - configs/experiment/knapsack_pilot.yaml
      - configs/evaluation/default.yaml
      - src/combinatorial_search_dynamics/data/splits.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/derived/knapsack_pilot/splits.json
  fit_model:
    cmd: uv run csd fit --force
    deps:
      - data/derived/knapsack_pilot/features.json
      - data/derived/knapsack_pilot/splits.json
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - configs/state_model/objective_gap.yaml
      - configs/dynamics/markov.yaml
      - src/combinatorial_search_dynamics/state_models/objective_gap.py
      - src/combinatorial_search_dynamics/state_models/registry.py
      - src/combinatorial_search_dynamics/dynamics/transition.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - artifacts/knapsack_pilot/state_model.json
      - artifacts/knapsack_pilot/dynamics_model.json
      - data/derived/knapsack_pilot/state_assignments.json
  analyze_success:
    cmd: uv run csd analyze-success --force
    deps:
      - data/raw/knapsack_pilot/instances.parquet
      - data/raw/knapsack_pilot/trials.parquet
      - data/raw/knapsack_pilot/checkpoints.parquet
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - data/derived/knapsack_pilot/splits.json
      - configs/features/success_prediction.yaml
      - configs/evaluation/default.yaml
      - configs/experiment/knapsack_pilot.yaml
      - src/combinatorial_search_dynamics/features/success.py
      - src/combinatorial_search_dynamics/evaluation/success_features.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/derived/knapsack_pilot/success_features.parquet
      - data/derived/knapsack_pilot/instance_features.parquet
      - data/derived/knapsack_pilot/success_predictions.parquet
      - artifacts/knapsack_pilot/success_feature_models.json
      - artifacts/knapsack_pilot/success_feature_selection.json
      - artifacts/knapsack_pilot/success_feature_comparison.json
      - artifacts/knapsack_pilot/success_feature_comparison.md
      - artifacts/knapsack_pilot/success_analysis_config.json
  evaluate_model:
    cmd: uv run csd evaluate --force
    deps:
      - data/derived/knapsack_pilot/state_assignments.json
      - data/derived/knapsack_pilot/splits.json
      - artifacts/knapsack_pilot/state_model.json
      - artifacts/knapsack_pilot/dynamics_model.json
      - data/raw/knapsack_pilot/instances.parquet
      - data/raw/knapsack_pilot/trials.parquet
      - data/raw/knapsack_pilot/checkpoints.parquet
      - data/raw/knapsack_pilot/observations.zarr
      - data/raw/knapsack_pilot/metrics.parquet
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - configs/evaluation/default.yaml
      - configs/tracking/knapsack_local.yaml
      - src/combinatorial_search_dynamics/evaluation/metrics.py
      - src/combinatorial_search_dynamics/evaluation/knapsack.py
      - src/combinatorial_search_dynamics/provenance.py
      - src/combinatorial_search_dynamics/tracking/mlflow.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - data/derived/knapsack_pilot/metrics.parquet
      - data/derived/knapsack_pilot/predictions.json
      - data/derived/knapsack_pilot/evaluation_summary.json
      - artifacts/knapsack_pilot/provenance.json
      - artifacts/knapsack_pilot/resolved_config.json
      - artifacts/knapsack_pilot/validation.json
      - artifacts/knapsack_pilot/run.json
      - artifacts/knapsack_pilot/solver_config.json
      - artifacts/knapsack_pilot/solver_status_summary.json
      - artifacts/knapsack_pilot/feasible_check.json
  build_report:
    cmd: uv run csd report --force
    deps:
      - data/derived/knapsack_pilot/evaluation_summary.json
      - data/derived/knapsack_pilot/splits.json
      - data/raw/knapsack_pilot/instances.parquet
      - data/raw/knapsack_pilot/trials.parquet
      - data/raw/knapsack_pilot/checkpoints.parquet
      - data/raw/knapsack_pilot/reference_solutions.parquet
      - artifacts/knapsack_pilot/run.json
      - src/combinatorial_search_dynamics/reporting/tables.py
      - src/combinatorial_search_dynamics/pipeline/stages.py
    outs:
      - artifacts/knapsack_pilot/report.md
      - artifacts/knapsack_pilot/summary.csv
