[project]
name = "zhou-aim-reproduction"
version = "0.1.0"
description = "Reproducible SK-model Analog Ising Machine experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pillow>=10,<13",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhou_aim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

