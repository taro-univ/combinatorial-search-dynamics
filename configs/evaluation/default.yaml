name: default
implemented: true
split_unit: instance_id
test_final_evaluation_only: true
split_version: "1"
split_ratios:
  train: 0.6
  validation: 0.2
  test: 0.2
horizon: 1
probability_floor: 1.0e-12
success_prediction:
  regularization: 1.0
  max_iterations: 200
  tolerance: 1.0e-8
  calibration_bins: 5
  min_delta: 1.0e-4
  max_features_m2: 3
  max_features_m3: 3
  bootstrap_samples: 500
