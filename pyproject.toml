[project]
name = "llm-search-dynamics"
version = "0.1.0"
description = "Research platform for LLM search dynamics experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dvc>=3.0.0,<4.0.0",
  "duckdb>=1.0.0,<2.0.0",
  "hydra-core>=1.3.2",
  "mlflow>=3.0.0,<4.0.0",
  "numpy>=1.26.0,<3.0.0",
  "ortools>=9.15.0,<9.16.0",
  "pyarrow>=17.0.0,<26.0.0",
  "typer>=0.12.3",
  "zarr>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
lsd = "llm_search_dynamics.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true
